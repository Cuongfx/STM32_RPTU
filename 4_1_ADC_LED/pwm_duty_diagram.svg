<svg width="1000" height="650" viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How the duty cycle and PWM frequency are calculated from CNT and CCR</title>
<desc>The CNT counter ramps from 0 to Counter Period (999) once every PWM period (1ms). CCR is the Capture/Compare Register, the value written by SET_COMPARE. The PWM output pin is HIGH while CNT is less than CCR, and LOW once CNT reaches CCR, for the rest of the period. The fraction of the period spent HIGH is the duty cycle, perceived as brightness. Two examples are shown: a low CCR giving a short ON time and a dim LED, and a high CCR giving a long ON time and a bright LED. The whole cycle repeats every 1ms, 1000 times per second, far faster than the eye can perceive as blinking.</desc>
<rect width="1000" height="650" fill="#ffffff"/>

<text x="30" y="34" font-family="sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">1 microsecond is just one counter tick — NOT one LED blink</text>
<text x="30" y="54" font-family="sans-serif" font-size="12" fill="#555555">1000 of those ticks make up ONE full PWM period. The LED's actual on/off cycle is that whole period: 1ms (1kHz) — far too fast to see as blinking.</text>

<!-- CNT ramp -->
<line x1="60" y1="90" x2="60" y2="200" stroke="#1a1a1a" stroke-width="2"/>
<text x="35" y="98" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a1a1a">999</text>
<text x="35" y="204" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a1a1a">0</text>
<text x="16" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a1a1a" transform="rotate(-90 16 150)">CNT</text>

<line x1="60" y1="200" x2="700" y2="200" stroke="#1a1a1a" stroke-width="2"/>
<line x1="60" y1="200" x2="620" y2="90" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="620" y1="90" x2="620" y2="200" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="620" y1="200" x2="700" y2="182" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="2 2" opacity="0.5"/>

<!-- CCR level line -->
<line x1="60" y1="140" x2="380" y2="140" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="70" y="128" font-family="sans-serif" font-size="12" fill="#c0392b" font-weight="700">CCR</text>
<text x="70" y="122" font-family="sans-serif" font-size="10" fill="#c0392b"></text>
<line x1="380" y1="140" x2="380" y2="200" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="380" y="215" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c0392b">CNT = CCR</text>
<text x="712" y="128" font-family="sans-serif" font-size="11" fill="#c0392b" font-weight="700">CCR = Capture/Compare Register</text>
<text x="712" y="144" font-family="sans-serif" font-size="10.5" fill="#555555">(the value written by</text>
<text x="712" y="158" font-family="monospace" font-size="10.5" fill="#1a1a1a">__HAL_TIM_SET_COMPARE()</text>

<!-- PWM output waveform -->
<text x="30" y="256" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">PWM output pin (TIM_CHANNEL_2 / PA1)</text>

<path d="M60,286 H380 V326 H700"
      fill="none" stroke="#2f6fed" stroke-width="3"/>
<line x1="60" y1="270" x2="60" y2="342" stroke="#1a1a1a" stroke-width="1"/>

<text x="55" y="282" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1a1a1a">HIGH</text>
<text x="55" y="330" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1a1a1a">LOW</text>

<!-- ON time bracket -->
<line x1="60" y1="352" x2="380" y2="352" stroke="#2f6fed" stroke-width="2"/>
<line x1="60" y1="346" x2="60" y2="358" stroke="#2f6fed" stroke-width="2"/>
<line x1="380" y1="346" x2="380" y2="358" stroke="#2f6fed" stroke-width="2"/>
<text x="220" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2f6fed">ON time = CCR × tick period</text>

<!-- OFF time bracket -->
<line x1="380" y1="352" x2="700" y2="352" stroke="#555555" stroke-width="2"/>
<line x1="700" y1="346" x2="700" y2="358" stroke="#555555" stroke-width="2"/>
<text x="540" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">OFF time = (ARR+1-CCR) × tick period</text>

<!-- full period bracket -->
<line x1="60" y1="390" x2="700" y2="390" stroke="#1a1a1a" stroke-width="2"/>
<line x1="60" y1="384" x2="60" y2="396" stroke="#1a1a1a" stroke-width="2"/>
<line x1="700" y1="384" x2="700" y2="396" stroke="#1a1a1a" stroke-width="2"/>
<text x="380" y="412" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1a1a1a">1 full PWM period = 1 ms (1000 ticks)  →  repeats 1000×/second = 1 kHz</text>

<!-- formula box -->
<rect x="740" y="180" width="220" height="240" rx="10" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="756" y="204" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Duty cycle (brightness)</text>
<text x="756" y="224" font-family="monospace" font-size="11.5" fill="#1a1a1a">Duty % = CCR / (ARR+1)</text>
<text x="756" y="240" font-family="monospace" font-size="11.5" fill="#1a1a1a">        × 100%</text>

<text x="756" y="264" font-family="sans-serif" font-size="12" fill="#555555">This project's code:</text>
<text x="756" y="282" font-family="monospace" font-size="11" fill="#1a1a1a">duty = adc_raw*999/4095</text>
<text x="756" y="298" font-family="monospace" font-size="11" fill="#1a1a1a">CCR = duty</text>

<line x1="756" y1="314" x2="944" y2="314" stroke="#cccccc" stroke-width="1"/>

<text x="756" y="336" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">PWM frequency</text>
<text x="756" y="356" font-family="monospace" font-size="11.5" fill="#1a1a1a">= 1 / period = 1 / 1ms</text>
<text x="756" y="372" font-family="monospace" font-size="11.5" fill="#1a1a1a">= 1 kHz</text>
<text x="756" y="394" font-family="sans-serif" font-size="10.5" fill="#555555">Fixed by Prescaler+ARR only —</text>
<text x="756" y="408" font-family="sans-serif" font-size="10.5" fill="#555555">duty cycle never changes it.</text>

<!-- Two brightness examples -->
<line x1="30" y1="440" x2="960" y2="440" stroke="#cccccc" stroke-width="1"/>
<text x="30" y="464" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Same period (1ms), different CCR → different brightness</text>

<!-- Example A: dim -->
<text x="30" y="494" font-family="sans-serif" font-size="12" fill="#1a1a1a">Example A — CCR = 250</text>
<path d="M60,510 H220 V530 H700" fill="none" stroke="#2f6fed" stroke-width="3"/>
<line x1="60" y1="500" x2="60" y2="538" stroke="#1a1a1a" stroke-width="1"/>
<text x="440" y="494" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#555555">Duty ≈ 25%  →  dim</text>
<g>
<polygon points="740,505 740,535 764,520" fill="#f5a623" fill-opacity="0.35" stroke="#8a5a00" stroke-width="1.5"/>
</g>
<text x="780" y="524" font-family="sans-serif" font-size="11" fill="#555555">LED mostly OFF</text>

<!-- Example B: bright -->
<text x="30" y="566" font-family="sans-serif" font-size="12" fill="#1a1a1a">Example B — CCR = 750</text>
<path d="M60,582 H580 V602 H700" fill="none" stroke="#2f6fed" stroke-width="3"/>
<line x1="60" y1="572" x2="60" y2="610" stroke="#1a1a1a" stroke-width="1"/>
<text x="440" y="566" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#555555">Duty ≈ 75%  →  bright</text>
<g>
<polygon points="740,577 740,607 764,592" fill="#f5a623" fill-opacity="1" stroke="#8a5a00" stroke-width="1.5"/>
</g>
<text x="780" y="596" font-family="sans-serif" font-size="11" fill="#555555">LED mostly ON</text>
</svg>
