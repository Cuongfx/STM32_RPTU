<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Button decision tree with variable updates</title>
<desc>Flowchart showing how one debounced button press is classified into single click, double click, or hold, with the exact variable each node reads or sets in button.c.</desc>
<rect width="680" height="600" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g font-family="sans-serif">

<rect x="230" y="20" width="220" height="80" rx="8" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1"/>
<text x="340" y="40" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1a1a1a">Button press detected</text>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555555">after debounce filter</text>
<text x="340" y="82" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555555">→ sets time_press_start</text>

<line x1="340" y1="100" x2="340" y2="156" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="156" width="220" height="80" rx="8" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1"/>
<text x="340" y="176" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1a1a1a">Released before 500ms?</text>
<text x="340" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555555">long-press threshold</text>
<text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555555">→ reads time_press_start</text>

<path d="M340 236 L340 268 L212 268 L212 300" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="276" y="262" text-anchor="middle" font-size="12" fill="#1a1a1a">Yes</text>

<path d="M340 236 L340 268 L505 268 L505 300" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="422" y="262" text-anchor="middle" font-size="12" fill="#1a1a1a">No</text>

<rect x="102" y="300" width="220" height="80" rx="8" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1"/>
<text x="212" y="320" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1a1a1a">2nd click within 400ms?</text>
<text x="212" y="342" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555555">double-click window</text>
<text x="212" y="362" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555555">→ reads click_count</text>

<path d="M212 380 L212 412 L135 412 L135 444" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="173" y="406" text-anchor="middle" font-size="12" fill="#1a1a1a">No</text>

<path d="M212 380 L212 412 L345 412 L345 444" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="278" y="406" text-anchor="middle" font-size="12" fill="#1a1a1a">Yes</text>

<rect x="40" y="444" width="190" height="80" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="135" y="464" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#0C447C">Single click</text>
<text x="135" y="486" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">LED toggles once</text>
<text x="135" y="506" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">→ event_single_click=1</text>

<rect x="250" y="444" width="190" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="345" y="464" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#085041">Double click</text>
<text x="345" y="486" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">LED blinks 3 times</text>
<text x="345" y="506" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">→ event_double_click=1</text>

<rect x="410" y="300" width="190" height="80" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="505" y="320" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#633806">Hold</text>
<text x="505" y="342" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Blinks until release</text>
<text x="505" y="362" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">→ is_holding = 1 → 0</text>

<rect x="50" y="560" width="12" height="12" rx="3" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1"/>
<text x="68" y="566" dominant-baseline="central" font-size="12" fill="#1a1a1a">Decision point</text>

<rect x="220" y="560" width="12" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="238" y="566" dominant-baseline="central" font-size="12" fill="#1a1a1a">Single click</text>

<rect x="370" y="560" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="388" y="566" dominant-baseline="central" font-size="12" fill="#1a1a1a">Double click</text>

<rect x="520" y="560" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="538" y="566" dominant-baseline="central" font-size="12" fill="#1a1a1a">Hold</text>

</g>
</svg>
