<svg width="700" height="420" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Wiring diagram for the button + LED projects</title>
<desc>Nucleo-F446RE with an LED and resistor on PC1 to GND, and a push button on PC0 to GND using the internal pull-up.</desc>
<rect width="700" height="420" fill="#ffffff"/>

<rect x="40" y="40" width="200" height="340" rx="10" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="140" y="70" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">Nucleo-F446RE</text>

<!-- LED branch: PC1 -->
<line x1="240" y1="130" x2="300" y2="130" stroke="#1a1a1a" stroke-width="2"/>
<text x="245" y="120" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">PC1 (A4)</text>

<rect x="300" y="120" width="60" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="330" y="115" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a1a1a">R 330Ω</text>

<line x1="360" y1="130" x2="420" y2="130" stroke="#1a1a1a" stroke-width="2"/>

<g>
<polygon points="420,116 420,144 448,130" fill="#f5a623" stroke="#8a5a00" stroke-width="1.5"/>
<line x1="448" y1="116" x2="448" y2="144" stroke="#8a5a00" stroke-width="2"/>
<line x1="452" y1="120" x2="460" y2="112" stroke="#8a5a00" stroke-width="1.5"/>
<line x1="452" y1="128" x2="460" y2="120" stroke="#8a5a00" stroke-width="1.5"/>
</g>
<text x="434" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a1a1a">LEDY</text>

<line x1="448" y1="130" x2="560" y2="130" stroke="#1a1a1a" stroke-width="2"/>
<line x1="560" y1="130" x2="560" y2="360" stroke="#1a1a1a" stroke-width="2"/>

<!-- Button branch: PC0 -->
<line x1="240" y1="280" x2="300" y2="280" stroke="#1a1a1a" stroke-width="2"/>
<text x="245" y="270" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">PC0 (A5)</text>

<rect x="300" y="260" width="60" height="40" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<line x1="310" y1="290" x2="350" y2="270" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="310" cy="290" r="3" fill="#1a1a1a"/>
<circle cx="350" cy="270" r="3" fill="#1a1a1a"/>
<text x="330" y="316" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a1a1a">push button</text>
<text x="330" y="332" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">(internal pull-up,</text>
<text x="330" y="346" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">no external resistor)</text>

<line x1="360" y1="280" x2="560" y2="280" stroke="#1a1a1a" stroke-width="2"/>
<line x1="560" y1="280" x2="560" y2="360" stroke="#1a1a1a" stroke-width="2"/>

<!-- shared GND -->
<line x1="540" y1="360" x2="580" y2="360" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="548" y1="368" x2="572" y2="368" stroke="#1a1a1a" stroke-width="2"/>
<line x1="555" y1="376" x2="565" y2="376" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="560" y="396" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>
</svg>
