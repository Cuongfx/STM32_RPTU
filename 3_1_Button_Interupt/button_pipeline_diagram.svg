<svg width="680" height="1000" viewBox="0 0 680 1000" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Full button pipeline: interrupt, debounce filter, then the click/hold decision tree</title>
<desc>Flowchart starting at the EXTI interrupt handler, through the debounce filter that confirms a stable pin state, feeding into the decision tree that classifies the press as single click, double click, or hold, each node labeled with the variable it reads or sets.</desc>
<rect width="680" height="1000" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g font-family="sans-serif">

<rect x="230" y="20" width="220" height="80" rx="8" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1"/>
<text x="340" y="40" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1a1a1a">EXTI0_IRQHandler fires</text>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555555">press or release edge</text>
<text x="340" y="82" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555555">→ sets pin_changed = 1</text>

<line x1="340" y1="100" x2="340" y2="156" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="156" width="220" height="80" rx="8" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1"/>
<text x="340" y="176" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1a1a1a">Pin ≠ button_filter?</text>
<text x="340" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555555">if pin_changed, re-read</text>
<text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555555">→ resets button_filter</text>

<line x1="340" y1="236" x2="340" y2="292" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="292" width="220" height="80" rx="8" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1"/>
<text x="340" y="312" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1a1a1a">Stable ≥15ms elapsed?</text>
<text x="340" y="334" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555555">is_debouncing timeout</text>
<text x="340" y="354" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555555">→ sets button_current</text>

<line x1="340" y1="372" x2="340" y2="428" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="428" width="220" height="80" rx="8" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1"/>
<text x="340" y="448" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1a1a1a">Button press detected</text>
<text x="340" y="470" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555555">button_current changed</text>
<text x="340" y="490" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555555">→ sets time_press_start</text>

<line x1="340" y1="508" x2="340" y2="564" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="564" width="220" height="80" rx="8" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1"/>
<text x="340" y="584" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1a1a1a">Released before 500ms?</text>
<text x="340" y="606" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555555">long-press threshold</text>
<text x="340" y="626" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555555">→ reads time_press_start</text>

<path d="M340 644 L340 676 L212 676 L212 708" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="276" y="670" text-anchor="middle" font-size="12" fill="#1a1a1a">Yes</text>

<path d="M340 644 L340 676 L505 676 L505 708" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="422" y="670" text-anchor="middle" font-size="12" fill="#1a1a1a">No</text>

<rect x="102" y="708" width="220" height="80" rx="8" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1"/>
<text x="212" y="728" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1a1a1a">2nd click within 400ms?</text>
<text x="212" y="750" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555555">double-click window</text>
<text x="212" y="770" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555555">→ reads click_count</text>

<path d="M212 788 L212 820 L135 820 L135 852" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="173" y="814" text-anchor="middle" font-size="12" fill="#1a1a1a">No</text>

<path d="M212 788 L212 820 L304 820 L304 852" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="258" y="814" text-anchor="middle" font-size="12" fill="#1a1a1a">Yes</text>

<rect x="40" y="852" width="190" height="80" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="135" y="872" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#0C447C">Single click</text>
<text x="135" y="894" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">LED toggles once</text>
<text x="135" y="914" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">→ event_single_click=1</text>

<rect x="250" y="852" width="190" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="345" y="872" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#085041">Double click</text>
<text x="345" y="894" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">LED blinks 3 times</text>
<text x="345" y="914" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">→ event_double_click=1</text>

<rect x="410" y="708" width="190" height="80" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="505" y="728" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#633806">Hold</text>
<text x="505" y="750" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Blinks until release</text>
<text x="505" y="770" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">→ is_holding = 1 → 0</text>

<rect x="50" y="968" width="12" height="12" rx="3" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1"/>
<text x="68" y="974" dominant-baseline="central" font-size="12" fill="#1a1a1a">Logic / decision step</text>

<rect x="260" y="968" width="12" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="278" y="974" dominant-baseline="central" font-size="12" fill="#1a1a1a">Single click</text>

<rect x="410" y="968" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="428" y="974" dominant-baseline="central" font-size="12" fill="#1a1a1a">Double click</text>

<rect x="560" y="968" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="578" y="974" dominant-baseline="central" font-size="12" fill="#1a1a1a">Hold</text>

</g>
</svg>
