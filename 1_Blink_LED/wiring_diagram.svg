<svg width="700" height="420" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Wiring diagram for 1_Blink_LED</title>
<desc>Nucleo-F446RE with onboard LD2 on PA5 and an external LED with resistor on PA1 to GND.</desc>
<rect width="700" height="420" fill="#ffffff"/>

<rect x="40" y="60" width="200" height="300" rx="10" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="140" y="90" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">Nucleo-F446RE</text>

<circle cx="140" cy="300" r="14" fill="#f5a623" stroke="#8a5a00" stroke-width="1.5"/>
<text x="140" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a1a1a">LD2 (onboard)</text>
<text x="140" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a1a1a">PA5 - no wiring needed</text>

<line x1="240" y1="160" x2="300" y2="160" stroke="#1a1a1a" stroke-width="2"/>
<text x="245" y="150" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">PA1</text>

<rect x="300" y="150" width="60" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="330" y="145" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a1a1a">R 330Ω</text>

<line x1="360" y1="160" x2="420" y2="160" stroke="#1a1a1a" stroke-width="2"/>

<g>
<polygon points="420,146 420,174 448,160" fill="#f5a623" stroke="#8a5a00" stroke-width="1.5"/>
<line x1="448" y1="146" x2="448" y2="174" stroke="#8a5a00" stroke-width="2"/>
<line x1="452" y1="150" x2="460" y2="142" stroke="#8a5a00" stroke-width="1.5"/>
<line x1="452" y1="158" x2="460" y2="150" stroke="#8a5a00" stroke-width="1.5"/>
</g>
<text x="434" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a1a1a">LEDY (external)</text>

<line x1="448" y1="160" x2="500" y2="160" stroke="#1a1a1a" stroke-width="2"/>
<line x1="500" y1="160" x2="500" y2="330" stroke="#1a1a1a" stroke-width="2"/>
<line x1="480" y1="330" x2="520" y2="330" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="488" y1="338" x2="512" y2="338" stroke="#1a1a1a" stroke-width="2"/>
<line x1="495" y1="346" x2="505" y2="346" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="500" y="366" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>
</svg>
