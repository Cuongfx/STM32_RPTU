<svg width="1000" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Wiring diagram for the multi-channel ADC scan + DMA project</title>
<desc>Nucleo-F446RE with a potentiometer wiper on PA0 and an LDR voltage divider midpoint on PA1 as ADC inputs, and two LEDs with series resistors on PA6 and PA7 as PWM outputs driven by TIM3.</desc>
<rect width="1000" height="620" fill="#ffffff"/>

<rect x="30" y="40" width="220" height="520" rx="10" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="140" y="70" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">Nucleo-F446RE</text>

<!-- Single 3V3 source, split into a rail feeding both branches -->
<line x1="250" y1="150" x2="350" y2="150" stroke="#1a1a1a" stroke-width="2"/>
<text x="255" y="140" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">3V3</text>
<line x1="350" y1="90" x2="350" y2="300" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="350" cy="150" r="4" fill="#1a1a1a"/>
<circle cx="350" cy="90" r="4" fill="#1a1a1a"/>
<circle cx="350" cy="300" r="4" fill="#1a1a1a"/>

<!-- Potentiometer branch (PA0) -->
<line x1="350" y1="90" x2="430" y2="90" stroke="#1a1a1a" stroke-width="2"/>
<line x1="430" y1="90" x2="430" y2="140" stroke="#1a1a1a" stroke-width="2"/>

<text x="430" y="113" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a1a1a">10kΩ potentiometer</text>
<text x="430" y="129" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">(linear, B103)</text>

<rect x="410" y="140" width="40" height="90" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

<line x1="250" y1="185" x2="406" y2="185" stroke="#1a1a1a" stroke-width="2"/>
<polygon points="410,185 396,179 396,191" fill="#1a1a1a"/>
<text x="255" y="172" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">PA0 (A0)</text>
<text x="255" y="205" font-family="sans-serif" font-size="11" fill="#555555">wiper — ADC1_IN0</text>

<line x1="430" y1="230" x2="430" y2="250" stroke="#1a1a1a" stroke-width="2"/>
<line x1="430" y1="250" x2="700" y2="250" stroke="#1a1a1a" stroke-width="2"/>
<line x1="700" y1="250" x2="700" y2="560" stroke="#1a1a1a" stroke-width="2"/>

<!-- LDR divider branch (PA1) -->
<line x1="350" y1="300" x2="430" y2="300" stroke="#1a1a1a" stroke-width="2"/>
<line x1="430" y1="300" x2="430" y2="330" stroke="#1a1a1a" stroke-width="2"/>

<rect x="410" y="330" width="40" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="460" y="364" font-family="sans-serif" font-size="12" fill="#1a1a1a">LDR (light sensor)</text>

<line x1="430" y1="390" x2="430" y2="430" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="430" cy="430" r="4" fill="#1a1a1a"/>

<line x1="250" y1="430" x2="412" y2="430" stroke="#1a1a1a" stroke-width="2"/>
<polygon points="426,430 412,424 412,436" fill="#1a1a1a"/>
<text x="255" y="417" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">PA1 (A1)</text>
<text x="255" y="450" font-family="sans-serif" font-size="11" fill="#555555">midpoint — ADC1_IN1</text>

<line x1="430" y1="430" x2="430" y2="470" stroke="#1a1a1a" stroke-width="2"/>

<rect x="410" y="470" width="40" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="460" y="504" font-family="sans-serif" font-size="12" fill="#1a1a1a">R 10kΩ</text>

<line x1="430" y1="530" x2="430" y2="560" stroke="#1a1a1a" stroke-width="2"/>

<!-- LED1 branch (PA6) -->
<text x="560" y="80" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">PA6 (D12)</text>
<text x="560" y="105" font-family="sans-serif" font-size="11" fill="#555555">TIM3_CH1 PWM</text>
<line x1="620" y1="90" x2="680" y2="90" stroke="#1a1a1a" stroke-width="2"/>

<text x="710" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a1a1a">R 330Ω</text>
<rect x="680" y="80" width="60" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

<line x1="740" y1="90" x2="780" y2="90" stroke="#1a1a1a" stroke-width="2"/>
<g>
<polygon points="780,76 780,104 808,90" fill="#f5a623" stroke="#8a5a00" stroke-width="1.5"/>
<line x1="808" y1="76" x2="808" y2="104" stroke="#8a5a00" stroke-width="2"/>
</g>
<text x="794" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a1a1a">LED1</text>

<line x1="808" y1="90" x2="950" y2="90" stroke="#1a1a1a" stroke-width="2"/>

<!-- LED2 branch (PA7) -->
<text x="560" y="170" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">PA7 (D11)</text>
<text x="560" y="195" font-family="sans-serif" font-size="11" fill="#555555">TIM3_CH2 PWM</text>
<line x1="620" y1="180" x2="680" y2="180" stroke="#1a1a1a" stroke-width="2"/>

<text x="710" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a1a1a">R 330Ω</text>
<rect x="680" y="170" width="60" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

<line x1="740" y1="180" x2="780" y2="180" stroke="#1a1a1a" stroke-width="2"/>
<g>
<polygon points="780,166 780,194 808,180" fill="#f5a623" stroke="#8a5a00" stroke-width="1.5"/>
<line x1="808" y1="166" x2="808" y2="194" stroke="#8a5a00" stroke-width="2"/>
</g>
<text x="794" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a1a1a">LED2</text>

<line x1="808" y1="180" x2="950" y2="180" stroke="#1a1a1a" stroke-width="2"/>
<line x1="950" y1="90" x2="950" y2="560" stroke="#1a1a1a" stroke-width="2"/>

<!-- shared GND bus -->
<line x1="430" y1="560" x2="950" y2="560" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="430" cy="560" r="4" fill="#1a1a1a"/>
<circle cx="700" cy="560" r="4" fill="#1a1a1a"/>
<circle cx="950" cy="560" r="4" fill="#1a1a1a"/>

<line x1="680" y1="560" x2="720" y2="560" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="688" y1="568" x2="712" y2="568" stroke="#1a1a1a" stroke-width="2"/>
<line x1="695" y1="576" x2="705" y2="576" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="700" y="598" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>
</svg>
