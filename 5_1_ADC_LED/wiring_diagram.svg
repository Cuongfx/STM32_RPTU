<svg width="700" height="480" viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Wiring diagram for the ADC single-channel + PWM LED project</title>
<desc>Nucleo-F446RE with a 10k potentiometer wiper on PA0 (ADC1_IN0) for input, and an LED with series resistor on PA1 (TIM2_CH2 PWM output) for output. PA1 goes through the resistor, through the LED, and only then to GND.</desc>
<rect width="700" height="480" fill="#ffffff"/>

<rect x="40" y="40" width="200" height="400" rx="10" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="140" y="70" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">Nucleo-F446RE</text>

<!-- 3V3 rail to potentiometer top -->
<line x1="240" y1="90" x2="360" y2="90" stroke="#1a1a1a" stroke-width="2"/>
<text x="245" y="80" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">3V3</text>
<line x1="360" y1="90" x2="360" y2="140" stroke="#1a1a1a" stroke-width="2"/>

<!-- Potentiometer body (vertical resistive element) -->
<rect x="340" y="140" width="40" height="110" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="500" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a1a1a">10kΩ potentiometer</text>
<text x="500" y="166" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">(linear, B103)</text>

<!-- Wiper arrow pointing into the middle of the pot -->
<line x1="300" y1="195" x2="336" y2="195" stroke="#1a1a1a" stroke-width="2"/>
<polygon points="336,195 322,189 322,201" fill="#1a1a1a"/>
<text x="245" y="185" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">PA0 (A0)</text>
<text x="245" y="200" font-family="sans-serif" font-size="11" fill="#555555">wiper (pin 2)</text>

<!-- Potentiometer bottom terminal routed AROUND the LED branch, joins GND bus on the far right -->
<line x1="360" y1="250" x2="360" y2="270" stroke="#1a1a1a" stroke-width="2"/>
<line x1="360" y1="270" x2="640" y2="270" stroke="#1a1a1a" stroke-width="2"/>
<line x1="640" y1="270" x2="640" y2="420" stroke="#1a1a1a" stroke-width="2"/>

<!-- PA1 -> resistor -> LED branch (in series, ending at the LED cathode only) -->
<line x1="240" y1="320" x2="300" y2="320" stroke="#1a1a1a" stroke-width="2"/>
<text x="245" y="310" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">PA1 (A1)</text>
<text x="245" y="335" font-family="sans-serif" font-size="11" fill="#555555">TIM2_CH2 PWM</text>

<rect x="300" y="310" width="60" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="330" y="303" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a1a1a">R 330Ω</text>

<line x1="360" y1="320" x2="420" y2="320" stroke="#1a1a1a" stroke-width="2"/>

<g>
<polygon points="420,306 420,334 448,320" fill="#f5a623" stroke="#8a5a00" stroke-width="1.5"/>
<line x1="448" y1="306" x2="448" y2="334" stroke="#8a5a00" stroke-width="2"/>
<line x1="452" y1="310" x2="460" y2="302" stroke="#8a5a00" stroke-width="1.5"/>
<line x1="452" y1="318" x2="460" y2="310" stroke="#8a5a00" stroke-width="1.5"/>
</g>
<text x="434" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a1a1a">LEDY</text>

<!-- LED cathode down to the shared GND bus -->
<line x1="448" y1="320" x2="560" y2="320" stroke="#1a1a1a" stroke-width="2"/>
<line x1="560" y1="320" x2="560" y2="420" stroke="#1a1a1a" stroke-width="2"/>

<!-- shared GND bus: LED cathode (560) and potentiometer bottom terminal (640) join here -->
<line x1="560" y1="420" x2="640" y2="420" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="560" cy="420" r="4" fill="#1a1a1a"/>
<circle cx="640" cy="420" r="4" fill="#1a1a1a"/>

<line x1="580" y1="420" x2="620" y2="420" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="588" y1="428" x2="612" y2="428" stroke="#1a1a1a" stroke-width="2"/>
<line x1="595" y1="436" x2="605" y2="436" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="600" y="456" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">GND</text>
</svg>
